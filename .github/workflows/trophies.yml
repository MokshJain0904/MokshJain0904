name: Update GitHub Trophies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  trophies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Trophies
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: MokshJain0904
          output_path: ./github-trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Move trophy into profile folder
        run: |
          mkdir -p profile
          mv github-trophies.svg profile/github-trophies.svg

      - name: Commit trophy SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/github-trophies.svg
          git diff --cached --quiet || git commit -m "Update GitHub trophies"
          git push
